name: Desktop internal test packages
# Formal publishing waits for user-approved identity, feed and signing setup.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: mac
            appRoot: release/mac-arm64/Pi Agent Desktop.app/Contents/Resources/app
          - os: windows-latest
            arch: x64
            target: win
            appRoot: release/win-unpacked/resources/app
          - os: ubuntu-latest
            arch: x64
            target: linux
            appRoot: release/linux-unpacked/resources/app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
            tools/e2e/package-lock.json
      - name: Install locked dependencies including bundled SDK
        run: |
          npm ci --include=dev --include=optional
          npm run install:desktop
          npm run install:e2e
      - name: Protected-source gate
        run: node scripts/check-desktop-baseline.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit regression
        run: npm test
      - name: Build original application
        run: npm run build
      - name: Build host
        run: npm run build:desktop
      - name: Original integration regression
        run: node tests/run-smoke.mjs --no-build
      - name: Package confirmed architecture without publishing
        run: npm run desktop:package -- --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verify actual package resources
        run: node scripts/check-desktop-package.mjs "${{ matrix.appRoot }}"
      - name: Generate checksums
        run: node scripts/desktop-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pi-agent-desktop-internal-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/SHA256SUMS.txt
      # Native window/PTTY, install and update acceptance must run on real target OS.
      # A successful packaging job alone is not a supported-platform claim.
